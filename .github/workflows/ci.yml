name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-flight runs for the same branch/PR when a new commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Lint, build & file-length
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (with corpus submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check file lengths (<= 400 lines)
        run: pnpm run file-length

      - name: Lint (ESLint + TS rules)
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Typecheck (packages + apps that define it)
        run: pnpm -r run typecheck

      # apps/web is deliberately not built here: astro build needs a seeded
      # local D1, and corpus:seed:local alone measures ~12m40s for 447,643
      # paragraphs — on top of the steps above that risks this job's 20-minute
      # budget. deploy.yml carries the seeded build instead, behind a cache
      # keyed on the corpus submodule SHA.
      - name: Build API
        run: pnpm run build:api
